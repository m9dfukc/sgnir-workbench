[project]
name = "sgnir-tools"
version = "0.1.0"
description = "Host tools for the sgnir workbench: QPSK firmware WAV encoder/decoder for the STM audio bootloader"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.scripts]
qpsk-encode = "sgnir_tools.qpsk_encoder:main"
qpsk-decode = "sgnir_tools.qpsk_decoder:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sgnir_tools"]
